<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Full Body</title>
  <meta name="description" content="Full body A/B/C met rusttimers, sessieduur en geschiedenis. Lokaal opgeslagen." />
  <meta name="theme-color" content="#0e1216" />
  <meta name="color-scheme" content="dark" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- iOS: volledig scherm bij starten vanaf het beginscherm -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Full Body" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Service worker registratie mislukt:', err);
        });
      });
    }
  </script>
</body>
</html>
